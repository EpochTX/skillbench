name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - if: failure() && matrix.node == 20
        run: |
          pnpm eslint tests/unit/public-api.test.ts tests/types/public-api-contract.ts
          mkdir -p .skillbench-output/prettier-formatted/docs .skillbench-output/prettier-formatted/tests/unit .skillbench-output/prettier-formatted/tests/types
          pnpm prettier --write README.md README_EN.md CHANGELOG.md docs/API.md tests/unit/public-api.test.ts tests/types/public-api-contract.ts
          cp README.md README_EN.md CHANGELOG.md .skillbench-output/prettier-formatted/
          cp docs/API.md .skillbench-output/prettier-formatted/docs/API.md
          cp tests/unit/public-api.test.ts .skillbench-output/prettier-formatted/tests/unit/public-api.test.ts
          cp tests/types/public-api-contract.ts .skillbench-output/prettier-formatted/tests/types/public-api-contract.ts
      - if: failure() && matrix.node == 20
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prettier-formatted-api-contract
          path: .skillbench-output/prettier-formatted
          if-no-files-found: error
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm benchmark:rules
      - run: pnpm build
      - run: pnpm test:dist
      - if: matrix.node == 22
        run: pnpm pack:check

  platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:dist
