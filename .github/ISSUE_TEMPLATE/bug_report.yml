name: Bug report
description: Report incorrect behavior, a crash, or a false result.
title: 'bug: '
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove secrets and proprietary instructions before submitting.
  - type: input
    id: version
    attributes:
      label: SkillBench version
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 20.19.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and sanitized input
      description: Include a minimal instruction file only if it contains no real secrets or private data.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed all credentials, private keys, cookies, and proprietary instructions.
          required: true
