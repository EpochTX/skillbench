name: SkillBench

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  skillbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
      - name: Install SkillBench v0.2.0 from source
        run: |
          git clone --no-checkout https://github.com/EpochTX/skillbench.git "$RUNNER_TEMP/skillbench"
          git -C "$RUNNER_TEMP/skillbench" checkout --detach 35e2415a612f838bd08bcb3f6c536e92be60d221
          pnpm --dir "$RUNNER_TEMP/skillbench" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/skillbench" build
      - name: Analyze agent instructions
        run: node "$RUNNER_TEMP/skillbench/dist/cli.js" "$GITHUB_WORKSPACE" --format sarif --output skillbench.sarif --ci --fail-on error
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: skillbench.sarif
