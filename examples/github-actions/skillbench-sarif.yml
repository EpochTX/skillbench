name: SkillBench

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  skillbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install SkillBench
        run: npm install -g skillbench-ai
      - name: Analyze agent instructions
        run: skillbench scan . --format sarif --output skillbench.sarif --ci --fail-on error
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: skillbench.sarif
